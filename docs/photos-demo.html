<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos & NASA layers — test page</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    :root { color-scheme: dark; --bg: #140e0c; --panel: #21171380; --text: #f2e6dc; --muted: #b9a596; --accent: #e8a25f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid #3a2a22; }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
    #map { height: calc(100vh - 110px); min-height: 420px; border-radius: 8px; background: #2a1d17; }
    #stops { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px;
      align-content: start; max-height: calc(100vh - 110px); overflow: auto; }
    .stop { background: var(--panel); border: 1px solid #3a2a22; border-radius: 8px; padding: 10px; }
    .stop.sel { border-color: var(--accent); }
    .stop h2 { margin: 0 0 6px; font-size: 14px; }
    .stop h2 small { color: var(--muted); font-weight: normal; }
    .pin { background: var(--accent); color: #140e0c; border-radius: 50%; width: 22px; height: 22px;
      display: grid; place-items: center; font-weight: 700; font-size: 12px; border: 2px solid #fff; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } #map { height: 60vh; } #stops { max-height: none; } }
  </style>
</head>
<body>
  <header>
    <h1>Marswalk Budget — photos & NASA layers test page</h1>
    <p>Real stops from <code>data/real/targets.json</code> on Mars Trek HiRISE imagery with Perseverance's traverse (dashed).
      Box = <code>data/real/area.json</code>. Photos: NASA/JPL-Caltech/ASU.</p>
  </header>
  <main>
    <div id="map"></div>
    <section id="stops"></section>
  </main>
  <script type="module">
    import { renderPhotos, photoMarkerIcon } from '../js/photos.js';
    import { addBaseLayers } from '../js/basemap.js';

    const [targets, area] = await Promise.all([
      fetch('../data/real/targets.json').then((r) => r.json()),
      fetch('../data/real/area.json').then((r) => r.json()),
    ]);
    const b = area.bounds;
    const map = L.map('map', { zoomSnap: 0.25, maxZoom: 19 });
    map.invalidateSize();
    map.fitBounds([[b.south, b.west], [b.north, b.east]]);
    // No terrain yet (data lane), so addBaseLayers falls back to area.json bounds.
    const { control } = addBaseLayers(map, null);
    L.rectangle([[b.south, b.west], [b.north, b.east]], { color: '#e8a25f', weight: 1.5, fill: false, dashArray: '2 4' }).addTo(map);

    const h = targets.habitat;
    L.marker([h.lat, h.lon], { icon: L.divIcon({ className: '', html: '<div class="pin">H</div>', iconSize: [22, 22] }) })
      .bindTooltip(h.name).addTo(map);

    const list = document.getElementById('stops');
    const cards = {};
    targets.targets.forEach((t, i) => {
      const card = document.createElement('article');
      card.className = 'stop';
      card.innerHTML = `<h2>${i + 1}. ${t.name} <small>sol ${t.sol} · value ${t.value} · ${t.dwellMin} min</small></h2>`;
      const box = document.createElement('div');
      card.append(box);
      list.append(card);
      renderPhotos(box, t);
      cards[t.id] = card;

      const icon = photoMarkerIcon(t) || L.divIcon({ className: '', html: `<div class="pin">${i + 1}</div>`, iconSize: [22, 22] });
      L.marker([t.lat, t.lon], { icon }).bindTooltip(`${i + 1}. ${t.name}`).addTo(map)
        .on('click', () => {
          Object.values(cards).forEach((c) => c.classList.remove('sel'));
          card.classList.add('sel');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
    });
    // Also exercise the "no photos" path with a demo-style stop.
    const demo = document.createElement('article');
    demo.className = 'stop';
    demo.innerHTML = '<h2>Demo stop <small>no photos (synthetic)</small></h2>';
    const demoBox = document.createElement('div');
    demo.append(demoBox);
    list.append(demo);
    renderPhotos(demoBox, { id: 'D2', name: 'Delta front layers', note: 'Synthetic. Exposed layers at the foot of the scarp.' });
    window.__demo = { map, control };
  </script>
</body>
</html>
